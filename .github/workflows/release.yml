name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag or version to release (e.g. v0.1.1 or 0.1.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Validate Release Target
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      version: ${{ steps.target.outputs.version }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test release workflow
        run: ruby Tests/check-release-workflow.rb

      - name: Resolve release target
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_INPUT: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              version="${RELEASE_INPUT#v}"
              tag="v${version}"
              ;;
            push)
              tag="$EVENT_TAG"
              version="${tag#v}"
              ;;
            *)
              echo "Unsupported release event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$tag" != "v${version}" ]]; then
            echo 'Release version must be three numbers, optionally prefixed with v.' >&2
            exit 1
          fi
          sha=$(gh api "repos/$GH_REPO/commits/refs/tags/$tag" --jq .sha)
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid commit returned for tag $tag" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == push && "$sha" != "$EVENT_SHA" ]]; then
            echo "Tag $tag no longer points to the triggering commit." >&2
            exit 1
          fi
          printf 'tag=%s\nversion=%s\nsha=%s\n' "$tag" "$version" "$sha" >> "$GITHUB_OUTPUT"

  release:
    name: Build and Publish DMG
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --find swift
          swift --version

      - name: Run test suite
        run: swift test

      - name: Package DMG
        id: package
        run: |
          set -euo pipefail
          echo "Packaging PiSwitch version: $RELEASE_VERSION (tag: $RELEASE_TAG, commit: $RELEASE_SHA)"
          bash scripts/package-release.sh "$RELEASE_VERSION"
          arch="$(uname -m)"
          out=".build/release-v${RELEASE_VERSION}"
          dmg="${out}/PiSwitch-v${RELEASE_VERSION}-macos-${arch}.dmg"
          (cd "$out" && shasum -a 256 "PiSwitch-v${RELEASE_VERSION}-macos-${arch}.dmg" > SHA256SUMS.txt)
          printf 'dmg=%s\nchecksums=%s\n' "$dmg" "$out/SHA256SUMS.txt" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DMG_PATH: ${{ steps.package.outputs.dmg }}
          CHECKSUMS_PATH: ${{ steps.package.outputs.checksums }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          sha=$(gh api "repos/$GH_REPO/commits/refs/tags/$RELEASE_TAG" --jq .sha)
          if [[ "$sha" != "$RELEASE_SHA" ]]; then
            echo "Tag $RELEASE_TAG moved after target resolution; refusing to publish." >&2
            exit 1
          fi
          (cd "$(dirname "$DMG_PATH")" && shasum -a 256 -c "$(basename "$CHECKSUMS_PATH")")
          releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if grep -Fxq -- "$RELEASE_TAG" <<< "$releases"; then
            echo "Release $RELEASE_TAG already exists; uploading assets..."
            gh release upload "$RELEASE_TAG" "$DMG_PATH" "$CHECKSUMS_PATH" --clobber
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" "$DMG_PATH" "$CHECKSUMS_PATH" \
              --verify-tag \
              --target "$RELEASE_SHA" \
              --title "PiSwitch $RELEASE_TAG" \
              --generate-notes
          fi
